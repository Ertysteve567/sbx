name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成所有源代码
        run: |
          mkdir -p src/main/java/com/example/namedobsidian/mixin
          mkdir -p src/main/resources/assets/minecraft/models/block
          mkdir -p src/main/resources/assets/minecraft/models/item
          mkdir -p gradle/wrapper

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "sbx_frag_7"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.7.4'
              id 'maven-publish'
          }
          version = "1.0.0"
          group = "com.example"
          repositories {
              mavenCentral()
              maven { url 'https://maven.fabricmc.net/' }
          }
          dependencies {
              minecraft "com.mojang:minecraft:1.21.1"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:0.15.11"
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1024M
          org.gradle.daemon=false
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "sbx_frag_7",
            "version": "1.0.0",
            "name": "<SBX://PROJ.FRAG-7/ACCESS:Ω>",
            "description": "铁砧命名改变纹理（物品栏 + 地面）",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "main": ["com.example.namedobsidian.NamedObsidianMod"],
              "client": ["com.example.namedobsidian.NamedObsidianClient"]
            },
            "mixins": ["namedobsidian.mixins.json"],
            "depends": {
              "fabricloader": ">=0.15.0",
              "minecraft": "~1.21.1"
            }
          }
          EOF

          cat > src/main/resources/namedobsidian.mixins.json <<'EOF'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.namedobsidian.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "PlaceMixin",
              "ModelManagerMixin"
            ],
            "injectors": { "defaultRequire": 1 }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/NamedObsidianMod.java <<'EOF'
          package com.example.namedobsidian;
          import net.fabricmc.api.ModInitializer;
          public class NamedObsidianMod implements ModInitializer {
              @Override public void onInitialize() {
                  System.out.println("[sbx_frag_7] 模组已加载");
              }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/ObsidianData.java <<'EOF'
          package com.example.namedobsidian;
          import net.minecraft.class_2338; // BlockPos
          import net.minecraft.class_1937; // Level
          import java.util.concurrent.ConcurrentHashMap;
          public class ObsidianData {
              public static final ConcurrentHashMap<class_2338, String> MAP = new ConcurrentHashMap<>();
              public static void putName(class_2338 pos, String name) { MAP.put(pos, name); }
              public static String getClientName(class_1937 world, class_2338 pos) { return MAP.get(pos); }
              public static void remove(class_2338 pos) { MAP.remove(pos); }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/NamedObsidianClient.java <<'EOF'
          package com.example.namedobsidian;
          import net.fabricmc.api.ClientModInitializer;
          public class NamedObsidianClient implements ClientModInitializer {
              @Override
              public void onInitializeClient() {
                  System.out.println("[sbx_frag_7] 客户端已加载");
              }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/mixin/PlaceMixin.java <<'EOF'
          package com.example.namedobsidian.mixin;
          import com.example.namedobsidian.ObsidianData;
          import net.minecraft.class_2338; // BlockPos
          import net.minecraft.class_1937; // Level
          import net.minecraft.class_1751; // BlockPlaceContext
          import net.minecraft.class_1268; // InteractionResult
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(targets = "net.minecraft.class_1747") // BlockItem
          public class PlaceMixin {
              // 1.21.1 中 BlockItem.place 的中间映射名为 method_7714
              @Inject(method = "method_7714", at = @At("RETURN"), remap = false)
              private static void onPlace(class_1751 context, CallbackInfoReturnable<class_1268> cir) {
                  if (cir.getReturnValue().consumesAction()) {
                      class_1937 world = context.getLevel();
                      if (world.isClientSide()) {
                          class_2338 pos = context.getClickedPos();
                          String name = context.getItemInHand().getDisplayName().getString();
                          if ("Void.exp".equals(name) || "<SKY.GEM>".equals(name)) {
                              ObsidianData.putName(pos, name);
                          }
                      }
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/mixin/ModelManagerMixin.java <<'EOF'
          package com.example.namedobsidian.mixin;
          import com.example.namedobsidian.ObsidianData;
          import net.minecraft.class_310; // Minecraft
          import net.minecraft.class_1088; // BakedModel
          import net.minecraft.class_1087; // ModelManager
          import net.minecraft.class_1089; // ModelLoader
          import net.minecraft.class_2338; // BlockPos
          import net.minecraft.class_2960; // ResourceLocation
          import net.minecraft.class_1937; // Level
          import net.minecraft.class_2246; // Blocks
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.ModifyReturnValue;

          @Mixin(targets = "net.minecraft.class_1087") // ModelManager
          public class ModelManagerMixin {
              // 1.21.1 中 replaceModel 方法只有一个参数（ModelLoader），返回 BakedModel
              // 使用 @ModifyReturnValue 修改返回值
              @ModifyReturnValue(method = "replaceModel", at = @At("RETURN"))
              private class_1088 replaceModel(class_1088 original, class_1089 loader) {
                  class_310 client = class_310.getInstance();
                  if (client == null || client.level == null) return original;
                  class_1937 level = client.level;
                  for (class_2338 pos : ObsidianData.MAP.keySet()) {
                      if (!level.isLoaded(pos)) continue;
                      String name = ObsidianData.getClientName(level, pos);
                      if (name == null) continue;
                      if (level.getBlockState(pos).getBlock() == class_2246.OBSIDIAN && "Void.exp".equals(name)) {
                          class_1087 manager = (class_1087)(Object)this;
                          class_1090 customLoc = new class_1090(class_2960.withDefaultNamespace("block/obsidian_void"), "");
                          class_1088 custom = manager.getModel(customLoc);
                          if (custom != null && custom != manager.getMissingModel()) return custom;
                      } else if (level.getBlockState(pos).getBlock() == class_2246.CRYING_OBSIDIAN && "<SKY.GEM>".equals(name)) {
                          class_1087 manager = (class_1087)(Object)this;
                          class_1090 customLoc = new class_1090(class_2960.withDefaultNamespace("block/crying_obsidian_sky"), "");
                          class_1088 custom = manager.getModel(customLoc);
                          if (custom != null && custom != manager.getMissingModel()) return custom;
                      }
                  }
                  return original;
              }
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/block/obsidian_void.json <<'EOF'
          {
            "parent": "minecraft:block/cube_all",
            "textures": { "all": "minecraft:block/obsidian_void" }
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/block/crying_obsidian_sky.json <<'EOF'
          {
            "parent": "minecraft:block/cube_all",
            "textures": { "all": "minecraft:block/crying_obsidian_sky" }
          }
          EOF

          echo "✅ 所有源码生成完毕！"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sbx_frag_7
          path: build/libs/*.jar
