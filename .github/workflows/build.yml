name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成所有源代码
        run: |
          mkdir -p src/main/java/com/example/namedobsidian
          mkdir -p src/main/resources/assets/minecraft/models/block
          mkdir -p src/main/resources/assets/minecraft/models/item
          mkdir -p gradle/wrapper

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.8.13'
              id 'maven-publish'
          }
          version = "1.0.0"
          group = "com.example"
          archivesBaseName = "sbx_frag_7"
          repositories { 
              mavenCentral()
              maven { url 'https://maven.fabricmc.net/' }
          }
          dependencies {
              minecraft "com.mojang:minecraft:1.21.1"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:0.15.11"
              // 使用用户游戏中已存在的 Fabric API 版本
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.8+1.21.1"
          }
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "sbx_frag_7"
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1024M
          org.gradle.daemon=false
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "sbx_frag_7",
            "version": "1.0.0",
            "name": "<SBX://PROJ.FRAG-7/ACCESS:Ω>",
            "description": "铁砧命名改变黑曜石/哭泣黑曜石纹理（物品栏）",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "main": ["com.example.namedobsidian.NamedObsidianMod"],
              "client": ["com.example.namedobsidian.NamedObsidianClient"]
            },
            "depends": {
              "fabricloader": ">=0.15.0",
              "minecraft": "~1.21.1",
              "fabric-api": ">=0.116.8"
            }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/NamedObsidianMod.java <<'EOF'
          package com.example.namedobsidian;
          import net.fabricmc.api.ModInitializer;
          public class NamedObsidianMod implements ModInitializer {
              @Override public void onInitialize() {}
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/NamedObsidianClient.java <<'EOF'
          package com.example.namedobsidian;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.model.ModelPredicateProviderRegistry;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.item.Items;
          public class NamedObsidianClient implements ClientModInitializer {
              @Override
              public void onInitializeClient() {
                  ModelPredicateProviderRegistry.register(Items.OBSIDIAN,
                      ResourceLocation.withDefaultNamespace("void"),
                      (stack, world, entity, seed) -> {
                          String name = stack.getDisplayName().getString();
                          return "Void.exp".equals(name) ? 1.0f : 0.0f;
                      }
                  );
                  ModelPredicateProviderRegistry.register(Items.CRYING_OBSIDIAN,
                      ResourceLocation.withDefaultNamespace("sky"),
                      (stack, world, entity, seed) -> {
                          String name = stack.getDisplayName().getString();
                          return "<SKY.GEM>".equals(name) ? 1.0f : 0.0f;
                      }
                  );
                  // 输出日志确认注册成功
                  System.out.println("[sbx_frag_7] 物品属性注册完成！");
              }
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/item/obsidian.json <<'EOF'
          {
            "parent": "minecraft:item/generated",
            "textures": { "layer0": "minecraft:item/obsidian" },
            "overrides": [
              { "predicate": { "minecraft:void": 1 }, "model": "minecraft:item/obsidian_void" }
            ]
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/item/obsidian_void.json <<'EOF'
          {
            "parent": "minecraft:block/cube_all",
            "textures": { "all": "minecraft:block/obsidian_void" }
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/item/crying_obsidian.json <<'EOF'
          {
            "parent": "minecraft:item/generated",
            "textures": { "layer0": "minecraft:item/crying_obsidian" },
            "overrides": [
              { "predicate": { "minecraft:sky": 1 }, "model": "minecraft:item/crying_obsidian_sky" }
            ]
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/item/crying_obsidian_sky.json <<'EOF'
          {
            "parent": "minecraft:block/cube_all",
            "textures": { "all": "minecraft:block/crying_obsidian_sky" }
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/block/obsidian_void.json <<'EOF'
          {
            "parent": "minecraft:block/cube_all",
            "textures": { "all": "minecraft:block/obsidian_void" }
          }
          EOF
          cat > src/main/resources/assets/minecraft/models/block/crying_obsidian_sky.json <<'EOF'
          {
            "parent": "minecraft:block/cube_all",
            "textures": { "all": "minecraft:block/crying_obsidian_sky" }
          }
          EOF

          echo "✅ 所有源码生成完毕！"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sbx_frag_7
          path: build/libs/*.jar
