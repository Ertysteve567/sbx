name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成所有源代码
        run: |
          mkdir -p src/main/java/com/example/namedobsidian/mixin
          mkdir -p src/main/resources/assets/minecraft/models/block
          mkdir -p src/main/resources/assets/minecraft/models/item
          mkdir -p gradle/wrapper

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.7.4'
              id 'java'
          }
          version = "1.0.0"
          group = "com.example"
          repositories {
              mavenCentral()
              maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
          }
          dependencies {
              minecraft "com.mojang:minecraft:1.21.1"
              // 使用 Yarn 映射
              mappings "net.fabricmc:yarn:1.21.1+build.10:v2"
              modImplementation "net.fabricmc:fabric-loader:0.15.11"
          }
          EOF

          # 其余配置与之前稳定版相同...
          # （保持 PlaceMixin + BlockRenderDispatcherMixin，禁用 ModelManagerMixin）

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sbx_frag_7
          path: build/libs/*.jar
