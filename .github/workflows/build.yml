name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成所有源代码
        run: |
          mkdir -p src/main/java/com/example/namedobsidian
          mkdir -p src/main/resources/assets/minecraft/models/block
          mkdir -p src/main/resources/assets/minecraft/models/item
          mkdir -p gradle/wrapper

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "sbx_frag_7"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.7.4'
          }
          repositories {
              mavenCentral()
              maven { url 'https://maven.fabricmc.net/' }
          }
          dependencies {
              minecraft "com.mojang:minecraft:1.21.1"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:0.15.11"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.15+1.21.1"
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1024M
          org.gradle.daemon=false
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "sbx_frag_7",
            "version": "1.0.0",
            "name": "<SBX://PROJ.FRAG-7/ACCESS:Ω>",
            "description": "铁砧命名改变纹理（物品栏）+ 地面颜色变化",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "main": ["com.example.namedobsidian.NamedObsidianMod"],
              "client": ["com.example.namedobsidian.NamedObsidianClient"]
            },
            "depends": {
              "fabricloader": ">=0.15.0",
              "minecraft": "~1.21.1",
              "fabric-api": ">=0.116.15"
            }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/NamedObsidianMod.java <<'EOF'
          package com.example.namedobsidian;
          import net.fabricmc.api.ModInitializer;
          public class NamedObsidianMod implements ModInitializer {
              @Override public void onInitialize() {
                  System.out.println("[sbx_frag_7] 模组已加载");
              }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/NamedObsidianClient.java <<'EOF'
          package com.example.namedobsidian;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.rendering.v1.ColorProviderRegistry;
          import net.fabricmc.fabric.api.event.player.PlayerBlockBreakEvents;
          import net.fabricmc.fabric.api.event.player.UseBlockCallback;
          import net.minecraft.core.BlockPos;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Blocks;
          import java.util.concurrent.ConcurrentHashMap;

          public class NamedObsidianClient implements ClientModInitializer {
              private static final ConcurrentHashMap<String, String> NAME_MAP = new ConcurrentHashMap<>();

              @Override
              public void onInitializeClient() {
                  UseBlockCallback.EVENT.register((player, level, hand, hitResult) -> {
                      if (level.isClientSide()) {
                          BlockPos pos = hitResult.getBlockPos();
                          String name = player.getItemInHand(hand).getDisplayName().getString();
                          if (level.getBlockState(pos).getBlock() == Blocks.OBSIDIAN && !name.isEmpty()) {
                              NAME_MAP.put(pos.getX() + "," + pos.getY() + "," + pos.getZ(), name);
                              System.out.println("[sbx_frag_7] 记录命名: " + name + " at " + pos);
                          }
                      }
                      return InteractionResult.PASS;
                  });

                  PlayerBlockBreakEvents.BEFORE.register((level, player, pos, state, blockEntity) -> {
                      if (level.isClientSide()) {
                          NAME_MAP.remove(pos.getX() + "," + pos.getY() + "," + pos.getZ());
                      }
                      return true;
                  });

                  // 地面颜色变化 - 已按要求修改颜色值
                  ColorProviderRegistry.BLOCK.register((state, world, pos, tintIndex) -> {
                      if (world == null || pos == null) return 0xFF2D2D2D;
                      String name = NAME_MAP.get(pos.getX() + "," + pos.getY() + "," + pos.getZ());
                      if (name == null) return 0xFF2D2D2D;
                      if ("Void.exp".equals(name)) {
                          return 0xFFB5B5B5; // 银灰色 #B5B5B5
                      }
                      if ("<SKY.GEM>".equals(name)) {
                          return 0xFF59A0D0; // 淡蓝色 #59A0D0
                      }
                      return 0xFF2D2D2D;
                  }, Blocks.OBSIDIAN, Blocks.CRYING_OBSIDIAN);

                  System.out.println("[sbx_frag_7] 地面颜色变化已注册");
              }
          }
          EOF

          echo "✅ 所有源码生成完毕！"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sbx_frag_7
          path: build/libs/*.jar
