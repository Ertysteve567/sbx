name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成所有源代码
        run: |
          mkdir -p src/main/java/com/example/namedobsidian/mixin
          mkdir -p src/main/resources/assets/minecraft/models/block
          mkdir -p src/main/resources/assets/minecraft/models/item
          mkdir -p gradle/wrapper

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.7.4'
              id 'java'
          }
          version = "1.0.0"
          group = "com.example"
          repositories {
              mavenCentral()
              maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
          }
          dependencies {
              minecraft "com.mojang:minecraft:1.21.1"
              // 使用 Intermediary 映射，与 FCL 运行环境完全一致
              mappings "net.fabricmc:intermediary:1.21.1"
              modImplementation "net.fabricmc:fabric-loader:0.15.11"
          }
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "sbx_frag_7"
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1024M
          org.gradle.daemon=false
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "sbx_frag_7",
            "version": "1.0.0",
            "name": "<SBX://PROJ.FRAG-7/ACCESS:Ω>",
            "description": "铁砧命名改变黑曜石纹理（物品栏 + 地面）",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "main": ["com.example.namedobsidian.NamedObsidianMod"],
              "client": ["com.example.namedobsidian.NamedObsidianClient"]
            },
            "mixins": ["namedobsidian.mixins.json"],
            "depends": {
              "fabricloader": ">=0.15.0",
              "minecraft": "~1.21.1"
            }
          }
          EOF

          cat > src/main/resources/namedobsidian.mixins.json <<'EOF'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.namedobsidian.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "PlaceMixin",
              "BlockRenderDispatcherMixin",
              "ModelManagerMixin"
            ],
            "injectors": { "defaultRequire": 1 }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/NamedObsidianMod.java <<'EOF'
          package com.example.namedobsidian;
          import net.fabricmc.api.ModInitializer;
          public class NamedObsidianMod implements ModInitializer {
              @Override public void onInitialize() {
                  System.out.println("[sbx_frag_7] 模组已加载");
              }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/RenderContext.java <<'EOF'
          package com.example.namedobsidian;
          import net.minecraft.core.BlockPos;
          import net.minecraft.world.level.block.state.BlockState;
          public class RenderContext {
              private static final ThreadLocal<BlockState> CURRENT_STATE = new ThreadLocal<>();
              private static final ThreadLocal<BlockPos> CURRENT_POS = new ThreadLocal<>();
              public static void setState(BlockState state, BlockPos pos) { CURRENT_STATE.set(state); CURRENT_POS.set(pos); }
              public static BlockState getState() { return CURRENT_STATE.get(); }
              public static BlockPos getPos() { return CURRENT_POS.get(); }
              public static void clear() { CURRENT_STATE.remove(); CURRENT_POS.remove(); }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/ObsidianData.java <<'EOF'
          package com.example.namedobsidian;
          import net.minecraft.core.BlockPos;
          import net.minecraft.world.level.Level;
          import java.util.concurrent.ConcurrentHashMap;
          public class ObsidianData {
              private static final ConcurrentHashMap<BlockPos, String> MAP = new ConcurrentHashMap<>();
              public static void putName(BlockPos pos, String name) { MAP.put(pos, name); }
              public static String getClientName(Level world, BlockPos pos) { return MAP.get(pos); }
              public static void remove(BlockPos pos) { MAP.remove(pos); }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/NamedObsidianClient.java <<'EOF'
          package com.example.namedobsidian;
          import net.fabricmc.api.ClientModInitializer;
          import net.minecraft.client.renderer.item.ItemProperties;
          import net.minecraft.client.renderer.item.ClampedItemPropertyFunction;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.Items;
          import java.lang.reflect.Method;
          public class NamedObsidianClient implements ClientModInitializer {
              @Override
              public void onInitializeClient() {
                  try {
                      Method registerMethod = ItemProperties.class.getDeclaredMethod(
                          "register",
                          Item.class,
                          ResourceLocation.class,
                          ClampedItemPropertyFunction.class
                      );
                      registerMethod.setAccessible(true);
                      registerMethod.invoke(null, Items.OBSIDIAN,
                          ResourceLocation.withDefaultNamespace("void"),
                          (ClampedItemPropertyFunction) (stack, world, entity, seed) -> {
                              String name = stack.getDisplayName().getString();
                              return "Void.exp".equals(name) ? 1.0f : 0.0f;
                          }
                      );
                      registerMethod.invoke(null, Items.CRYING_OBSIDIAN,
                          ResourceLocation.withDefaultNamespace("sky"),
                          (ClampedItemPropertyFunction) (stack, world, entity, seed) -> {
                              String name = stack.getDisplayName().getString();
                              return "<SKY.GEM>".equals(name) ? 1.0f : 0.0f;
                          }
                      );
                      System.out.println("[sbx_frag_7] 物品栏纹理注册成功");
                  } catch (Exception e) {
                      System.err.println("[sbx_frag_7] 物品栏纹理注册失败（不影响地面功能）");
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/mixin/PlaceMixin.java <<'EOF'
          package com.example.namedobsidian.mixin;
          import com.example.namedobsidian.ObsidianData;
          import net.minecraft.core.BlockPos;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.item.BlockItem;
          import net.minecraft.world.item.context.BlockPlaceContext;
          import net.minecraft.world.level.Level;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          // 注意：Intermediary 映射下 BlockItem 的类名是 class_1747
          @Mixin(targets = "net.minecraft.class_1747")
          public class PlaceMixin {
              // Intermediary 中 place 方法名为 method_7714
              @Inject(method = "method_7714", at = @At("RETURN"))
              private static void onPlace(BlockPlaceContext context, CallbackInfoReturnable<InteractionResult> cir) {
                  if (cir.getReturnValue().consumesAction()) {
                      Level world = context.getLevel();
                      if (world.isClientSide()) {
                          BlockPos pos = context.getClickedPos();
                          String name = context.getItemInHand().getDisplayName().getString();
                          if ("Void.exp".equals(name) || "<SKY.GEM>".equals(name)) {
                              ObsidianData.putName(pos, name);
                          }
                      }
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/mixin/BlockRenderDispatcherMixin.java <<'EOF'
          package com.example.namedobsidian.mixin;
          import com.example.namedobsidian.RenderContext;
          import net.minecraft.core.BlockPos;
          import net.minecraft.world.level.block.state.BlockState;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          // Intermediary 中 BlockRenderDispatcher 的类名是 class_776
          @Mixin(targets = "net.minecraft.class_776")
          public class BlockRenderDispatcherMixin {
              // Intermediary 中 renderBlock 方法名为 method_39104
              @Inject(method = "method_39104", at = @At("HEAD"), remap = false)
              private void captureState(BlockState state, BlockPos pos, CallbackInfo ci) {
                  RenderContext.setState(state, pos);
              }
          }
          EOF

          cat > src/main/java/com/example/namedobsidian/mixin/ModelManagerMixin.java <<'EOF'
          package com.example.namedobsidian.mixin;
          import com.example.namedobsidian.ObsidianData;
          import com.example.namedobsidian.RenderContext;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.resources.model.BakedModel;
          import net.minecraft.client.resources.model.ModelManager;
          import net.minecraft.client.resources.model.ModelResourceLocation;
          import net.minecraft.core.BlockPos;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.state.BlockState;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.ModifyVariable;

          // Intermediary 中 ModelManager 的类名是 class_4084
          @Mixin(targets = "net.minecraft.class_4084")
          public class ModelManagerMixin {
              // Intermediary 中 getModel 方法名为 method_24178
              @ModifyVariable(method = "method_24178", at = @At("RETURN"), ordinal = 0)
              private BakedModel replaceModel(BakedModel original, ModelResourceLocation location) {
                  BlockState state = RenderContext.getState();
                  BlockPos pos = RenderContext.getPos();
                  if (state == null || pos == null) return original;
                  boolean isObsidian = state.getBlock() == Blocks.OBSIDIAN;
                  boolean isCrying = state.getBlock() == Blocks.CRYING_OBSIDIAN;
                  if (!isObsidian && !isCrying) return original;
                  Minecraft client = Minecraft.getInstance();
                  if (client == null || client.level == null) return original;
                  Level level = client.level;
                  String name = ObsidianData.getClientName(level, pos);
                  if (name == null) return original;
                  ModelManager manager = (ModelManager)(Object)this;
                  if (isObsidian && "Void.exp".equals(name)) {
                      ModelResourceLocation customLoc = new ModelResourceLocation(
                          ResourceLocation.withDefaultNamespace("block/obsidian_void"), "");
                      BakedModel custom = manager.getModel(customLoc);
                      if (custom != null && custom != manager.getMissingModel()) return custom;
                  } else if (isCrying && "<SKY.GEM>".equals(name)) {
                      ModelResourceLocation customLoc = new ModelResourceLocation(
                          ResourceLocation.withDefaultNamespace("block/crying_obsidian_sky"), "");
                      BakedModel custom = manager.getModel(customLoc);
                      if (custom != null && custom != manager.getMissingModel()) return custom;
                  }
                  return original;
              }
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/item/obsidian.json <<'EOF'
          {
            "parent": "minecraft:item/generated",
            "textures": { "layer0": "minecraft:item/obsidian" },
            "overrides": [
              { "predicate": { "minecraft:void": 1 }, "model": "minecraft:item/obsidian_void" }
            ]
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/item/obsidian_void.json <<'EOF'
          {
            "parent": "minecraft:block/cube_all",
            "textures": { "all": "minecraft:block/obsidian_void" }
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/item/crying_obsidian.json <<'EOF'
          {
            "parent": "minecraft:item/generated",
            "textures": { "layer0": "minecraft:item/crying_obsidian" },
            "overrides": [
              { "predicate": { "minecraft:sky": 1 }, "model": "minecraft:item/crying_obsidian_sky" }
            ]
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/item/crying_obsidian_sky.json <<'EOF'
          {
            "parent": "minecraft:block/cube_all",
            "textures": { "all": "minecraft:block/crying_obsidian_sky" }
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/block/obsidian_void.json <<'EOF'
          {
            "parent": "minecraft:block/cube_all",
            "textures": { "all": "minecraft:block/obsidian_void" }
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/block/crying_obsidian_sky.json <<'EOF'
          {
            "parent": "minecraft:block/cube_all",
            "textures": { "all": "minecraft:block/crying_obsidian_sky" }
          }
          EOF

          echo "✅ 所有源码生成完毕！"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sbx_frag_7
          path: build/libs/*.jar
