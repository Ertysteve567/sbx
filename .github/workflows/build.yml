name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成所有源代码
        run: |
          mkdir -p src/main/java/com/example/groundtexture/mixin
          mkdir -p src/main/resources/assets/minecraft/models/block
          mkdir -p gradle/wrapper

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.8.13'
              id 'maven-publish'
          }
          version = "1.0.0"
          group = "com.example"
          archivesBaseName = "ground_texture"
          repositories { 
              mavenCentral()
              maven { url 'https://maven.fabricmc.net/' }
          }
          dependencies {
              minecraft "com.mojang:minecraft:1.21.1"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:0.15.11"
          }
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "ground_texture"
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1024M
          org.gradle.daemon=false
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "ground_texture",
            "version": "1.0.0",
            "name": "Ground Texture Changer",
            "description": "Changes block texture based on item name when placed",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "main": ["com.example.groundtexture.GroundTextureMod"],
              "client": ["com.example.groundtexture.GroundTextureClient"]
            },
            "mixins": ["ground_texture.mixins.json"],
            "depends": {
              "fabricloader": ">=0.15.0",
              "minecraft": "~1.21.1"
            }
          }
          EOF

          cat > src/main/resources/ground_texture.mixins.json <<'EOF'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.groundtexture.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": ["BlockRenderDispatcherMixin", "PlaceMixin"],
            "injectors": { "defaultRequire": 1 }
          }
          EOF

          cat > src/main/java/com/example/groundtexture/GroundTextureMod.java <<'EOF'
          package com.example.groundtexture;
          import net.fabricmc.api.ModInitializer;
          public class GroundTextureMod implements ModInitializer {
              @Override public void onInitialize() {}
          }
          EOF

          cat > src/main/java/com/example/groundtexture/GroundTextureClient.java <<'EOF'
          package com.example.groundtexture;
          import net.fabricmc.api.ClientModInitializer;
          public class GroundTextureClient implements ClientModInitializer {
              @Override public void onInitializeClient() {}
          }
          EOF

          cat > src/main/java/com/example/groundtexture/TextureData.java <<'EOF'
          package com.example.groundtexture;
          import net.minecraft.core.BlockPos;
          import net.minecraft.world.level.Level;
          import java.util.concurrent.ConcurrentHashMap;
          public class TextureData {
              private static final ConcurrentHashMap<BlockPos, String> MAP = new ConcurrentHashMap<>();
              public static void put(BlockPos pos, String name) { MAP.put(pos, name); }
              public static String get(Level world, BlockPos pos) { return MAP.get(pos); }
              public static void remove(BlockPos pos) { MAP.remove(pos); }
          }
          EOF

          cat > src/main/java/com/example/groundtexture/mixin/PlaceMixin.java <<'EOF'
          package com.example.groundtexture.mixin;
          import com.example.groundtexture.TextureData;
          import net.minecraft.core.BlockPos;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.item.BlockItem;
          import net.minecraft.world.item.context.BlockPlaceContext;
          import net.minecraft.world.level.Level;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(BlockItem.class)
          public class PlaceMixin {
              @Inject(method = "place", at = @At("RETURN"))
              private void onPlace(BlockPlaceContext context, CallbackInfoReturnable<InteractionResult> cir) {
                  if (cir.getReturnValue().consumesAction()) {
                      Level world = context.getLevel();
                      if (world.isClientSide()) {
                          BlockPos pos = context.getClickedPos();
                          String name = context.getItemInHand().getDisplayName().getString();
                          if ("Void.exp".equals(name) || "<SKY.GEM>".equals(name)) {
                              TextureData.put(pos, name);
                          }
                      }
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/groundtexture/mixin/BlockRenderDispatcherMixin.java <<'EOF'
          package com.example.groundtexture.mixin;
          import com.example.groundtexture.TextureData;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.renderer.block.BlockRenderDispatcher;
          import net.minecraft.client.resources.model.BakedModel;
          import net.minecraft.client.resources.model.ModelResourceLocation;
          import net.minecraft.core.BlockPos;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.level.BlockAndTintGetter;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.state.BlockState;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.ModifyVariable;

          @Mixin(BlockRenderDispatcher.class)
          public class BlockRenderDispatcherMixin {
              @ModifyVariable(method = "renderBlock", at = @At("HEAD"), argsOnly = true, index = 3)
              private BakedModel replaceModel(BakedModel original, BlockState state, BlockPos pos, BlockAndTintGetter world) {
                  if (world instanceof Level) {
                      Level level = (Level) world;
                      if (!level.isClientSide()) return original;
                      String name = TextureData.get(level, pos);
                      if (name == null) return original;
                      Minecraft client = Minecraft.getInstance();
                      if (state.getBlock() == Blocks.OBSIDIAN && "Void.exp".equals(name)) {
                          BakedModel custom = client.getModelManager().getModel(new ModelResourceLocation(
                              ResourceLocation.withDefaultNamespace("block/obsidian_void"), ""));
                          if (custom != null) return custom;
                      } else if (state.getBlock() == Blocks.CRYING_OBSIDIAN && "<SKY.GEM>".equals(name)) {
                          BakedModel custom = client.getModelManager().getModel(new ModelResourceLocation(
                              ResourceLocation.withDefaultNamespace("block/crying_obsidian_sky"), ""));
                          if (custom != null) return custom;
                      }
                  }
                  return original;
              }
          }
          EOF

          cat > src/main/resources/assets/minecraft/models/block/obsidian_void.json <<'EOF'
          {"parent":"minecraft:block/cube_all","textures":{"all":"minecraft:block/obsidian_void"}}
          EOF
          cat > src/main/resources/assets/minecraft/models/block/crying_obsidian_sky.json <<'EOF'
          {"parent":"minecraft:block/cube_all","textures":{"all":"minecraft:block/crying_obsidian_sky"}}
          EOF

          echo "✅ 所有源码生成完毕！"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ground_texture
          path: build/libs/*.jar
